name: Client CI (pnpm)

on:
  push:
    paths: ["client/**", ".github/workflows/client-ci.yml"]
  pull_request:
    paths: ["client/**", ".github/workflows/client-ci.yml"]
  workflow_dispatch:

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      # ถ้ามี lockfile ใช้ --frozen-lockfile เพื่อ reproducible builds
      - name: Install deps
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install
          fi

      - name: Test
        run: pnpm test -- --ci --passWithNoTests

      - name: Build
        run: pnpm run build:production

      - name: Upload client dist
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist

  deploy:
    needs: client
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development')
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY:  ${{ secrets.SSH_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy client via SSH
        if: env.SSH_HOST != '' && env.SSH_USER != '' && env.SSH_KEY != ''
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          script: |
            set -euo pipefail
            BRANCH="${{ github.ref_name }}"
            APP_DIR="/var/www/dearmetoday"  # ปรับให้ตรงเครื่องจริง

            cd "$APP_DIR"
            git fetch origin "$BRANCH"
            if git rev-parse --verify "$BRANCH" >/dev/null 2>&1; then
              git checkout "$BRANCH"
            else
              git checkout -b "$BRANCH"
            fi
            git pull origin "$BRANCH"

            export APP_ENV=production
            export NODE_ENV=production
            export CLIENT_PORT=8080

            docker compose pull client || true
            docker compose build client
            docker compose up -d client