name: Client CI

on:
  push:
    paths:
      - "client/**"
      - ".github/workflows/client-ci.yml"
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/client-ci.yml"
  workflow_dispatch:

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install deps (ci if lockfile exists)
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Test
        run: npm test -- --ci --passWithNoTests

      - name: Build
        run: npm run build:production

      - name: Upload client dist
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist

  deploy:
    needs: client
    runs-on: ubuntu-latest
    # ตรวจเฉพาะ event/branch ที่ระดับ job (ห้ามใช้ secrets ที่นี่)
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development')
    # ผูก secrets เป็น env ของทั้ง job เพื่อให้ step เรียกใช้ได้
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY:  ${{ secrets.SSH_KEY }}
      # (ถ้ามีปลายทาง/Path เป็นความลับ คุณสามารถสร้าง secret DEPLOY_PATH แล้วใช้แทนได้)
      # DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}

    steps:
      - name: Checkout repo (for branch context)
        uses: actions/checkout@v4

      # ข้ามอย่างนุ่มนวลถ้า secrets ยังไม่ครบ (ไม่ fail ทั้ง job)
      - name: Deploy client via SSH
        if: >
          env.SSH_HOST != '' &&
          env.SSH_USER != '' &&
          env.SSH_KEY  != ''
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ env.SSH_HOST }}
          username: ${{ env.SSH_USER }}
          key: ${{ env.SSH_KEY }}
          script: |
            set -euo pipefail

            BRANCH="${{ github.ref_name }}"
            # ปรับ path ให้ตรงกับเครื่องจริงของคุณ
            APP_DIR="/var/www/dearmetoday"

            cd "$APP_DIR"
            git fetch origin "$BRANCH"
            if git rev-parse --verify "$BRANCH" >/dev/null 2>&1; then
              git checkout "$BRANCH"
            else
              git checkout -b "$BRANCH"
            fi
            git pull origin "$BRANCH"

            # รีบิลด์/รีสตาร์ทเฉพาะ service ฝั่ง client (แก้ชื่อ service ให้ตรง compose ของคุณ)
            export APP_ENV=production
            export NODE_ENV=production
            export CLIENT_PORT=8080

            docker compose pull client || true
            docker compose build client
            docker compose up -d client