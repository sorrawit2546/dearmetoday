name: web-dearmetoday-frontyard

on:
  push:
    paths: ["client/**", ".github/workflows/client-ci.yml"]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+" # ให้รันตอน push tag ด้วย
  workflow_dispatch:

concurrency:
  group: client-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build
        run: npm run build:production

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: dearmetoday
          directory: client/dist/client
          commitHash: ${{ github.ref_name }}
