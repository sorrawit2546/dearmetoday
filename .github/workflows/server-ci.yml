name: web-dearmetoday-backyard

run-name: Deploy dearmetoday by ${{ github.actor }} on ${{ github.ref_name }}

on:  
  push:
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
  workflow_dispatch:

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint
        run: npm run lint

      - name: Test  
        run: npm test -- --ci --passWithNoTests

      - name: Build
        run: npm run build

      - name: Upload server dist
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: server/dist

  deploy:
    needs: server
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repository (for branch/tag context)
        uses: actions/checkout@v4

      - name: Deploy server via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: DATABASE_URL
          script: |
            set -euo pipefail

            # ตรวจว่าเป็น tag หรือ branch
            if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
              VERSION="${GITHUB_REF#refs/tags/}"
            else
              VERSION="${GITHUB_REF_NAME}"
            fi

            APP_DIR="/var/www/dearmetoday"
            BRANCH="$GITHUB_REF_NAME"

            cd "$APP_DIR"
            git fetch origin "$BRANCH"
            if git rev-parse --verify "$BRANCH" >/dev/null 2>&1; then
              git checkout "$BRANCH"
            else
              git checkout -b "$BRANCH"
            fi
            git pull origin "$BRANCH"

            export APP_ENV=production
            export NODE_ENV=production
            export IMAGE_VERSION="$VERSION"

            # Backup DB ก่อน deploy
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            mkdir -p "$APP_DIR/db_backups"
            docker exec backend sh -lc 'pg_dump "$DATABASE_URL"' > "$APP_DIR/db_backups/db_${TIMESTAMP}.sql"

            # รีบิลด์/รีสตาร์ท backend พร้อม build-arg version
            docker compose build --build-arg VERSION="$IMAGE_VERSION" backend
            docker compose up -d backend

            # Prisma migrate & generate
            docker exec backend npx prisma migrate deploy
            docker exec backend npx prisma generate
