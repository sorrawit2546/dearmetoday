name: web-dearmetoday-backyard

run-name: Deploy dearmetoday by ${{ github.actor }} on ${{ github.ref_name }}

on:  
  push:
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
  workflow_dispatch:

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint
        run: npm run lint

      - name: Test  
        run: npm test -- --ci --passWithNoTests

      - name: Build
        run: npm run build

      - name: Upload server dist
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: server/dist

  deploy:
    needs: server
    runs-on: ubuntu-latest
    if: >
      (github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')))
      || github.event_name == 'workflow_dispatch'
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
      SERVER_URL: ${{ secrets.SERVER_URL }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      COOKIE_DOMAIN: ${{ secrets.COOKIE_DOMAIN }}
      COOKIE_SECURE: ${{ secrets.COOKIE_SECURE }}
      COOKIE_SAMESITE: ${{ secrets.COOKIE_SAMESITE }}

    steps:
      - name: Checkout repository (for branch/tag context)
        uses: actions/checkout@v4

      - name: Deploy server via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: DATABASE_URL,DIRECT_URL,SENDGRID_API_KEY,MAIL_FROM,FRONTEND_URL,SERVER_URL,GOOGLE_CLIENT_ID,GOOGLE_CLIENT_SECRET,JWT_SECRET,COOKIE_DOMAIN,COOKIE_SECURE,COOKIE_SAMESITE
          script: |
            set -euo pipefail

            VERSION="${{ github.ref_name }}"
            APP_DIR="/var/www/dearmetoday"
            BRANCH="${{ github.ref_name }}"

            cd "$APP_DIR"
            git fetch origin "$BRANCH"
            git checkout "$BRANCH" || git checkout -b "$BRANCH"
            git pull origin "$BRANCH"

            export APP_ENV=production
            export NODE_ENV=production
            export IMAGE_VERSION="$VERSION"

            docker compose -f docker-compose.yml -f docker-compose.prod.yml down --remove-orphans || true
            docker compose -f docker-compose.yml -f docker-compose.prod.yml build --build-arg VERSION="$IMAGE_VERSION" server
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d server

            # 🟢 รอ container ready ก่อน exec
            echo "⏳ Waiting for server container to be ready..."
            sleep 10
            docker ps
            docker logs server --tail=50

            # Prisma migrate ใช้ Supabase URL
            docker exec -e DATABASE_URL="$DATABASE_URL" server npx prisma migrate deploy
            docker exec -e DATABASE_URL="$DATABASE_URL" server npx prisma generate
