name: Server CI

on:
  push:
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server-ci.yml"
  workflow_dispatch:

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install deps (ci if lockfile exists)
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test -- --ci --passWithNoTests

      - name: Build
        run: npm run build

      - name: Upload server dist
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: server-dist
          path: server/dist

  deploy:
    needs: server
    runs-on: ubuntu-latest
    # เช็คเฉพาะเหตุการณ์/สาขาในระดับ job (ไม่อ้างอิง secrets ที่นี่)
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development')
    # ผูก secrets เข้ามาเป็น env ของทั้ง job
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_KEY: ${{ secrets.SSH_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout repo (for branch context)
        uses: actions/checkout@v4

      - name: Deploy server via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: DATABASE_URL
          script: |
            set -euo pipefail
            BRANCH="${{ github.ref_name }}"
            APP_DIR="/var/www/dearmetoday"

            cd "$APP_DIR"
            git fetch origin "$BRANCH"
            if git rev-parse --verify "$BRANCH" >/dev/null 2>&1; then
              git checkout "$BRANCH"
            else
              git checkout -b "$BRANCH"
            fi
            git pull origin "$BRANCH"

            # ปิด service backend ชั่วคราวถ้าต้อง
            # docker compose stop backend || true

            # รีบิลด์/รีสตาร์ทเฉพาะ service ฝั่ง backend
            export APP_ENV=production
            export NODE_ENV=production

            docker compose pull backend || true
            docker compose build backend
            docker compose up -d backend

            # Backup DB
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            mkdir -p "$APP_DIR/db_backups"
            docker exec backend sh -lc 'pg_dump "$DATABASE_URL"' > "$APP_DIR/db_backups/db_${TIMESTAMP}.sql"

            # Prisma migrate & generate
            docker exec backend npx prisma migrate deploy
            docker exec backend npx prisma generate