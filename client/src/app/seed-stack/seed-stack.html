<div class="min-h-dvh bg-gradient-to-b from-transparent from-70% to-[#8FFFB4]">
    <app-header></app-header>
    <div class="flex flex-wrap px-8 min-h-full" id="body">
        <div class="flex-1 min-w-full md:min-w-[100] py-8 flex flex-col" id="header-section">
            <div class="text-center" id="title">
                <h1>Garden🌿</h1>
            </div>
            <div class="text-center" id="subtitle">
                <p>แต่ละดอกไม้ในสวนนี้ เกิดจากวันที่คุณเลือกดูแลหัวใจตัวเอง</p>
            </div>
        </div>
        <div class="flex-1 min-w-full md:min-w-[50%] p-6 flex flex-col justify-center text-center">
            <img class="object-contain object-center mx-auto 
                    w-[70vw] h-[70vw] max-w-[360px] max-h-[360px] md:w-[360px] md:h-[360px]"
                src="assets/images/testFlower.png" alt="plant" id="plant">
            <div class="text-center" id="Section-footer">
                <div class="w-full max-w-[300px] border border-black rounded-full p-[2px] mx-auto">
                    <div
                        class="w-[100%] bg-gradient-to-r from-[#7EC7FF] to-[#D6F4FF] rounded-full text-center text-xs py-[2px]">
                        17/24 Level Grow
                    </div>
                </div>
                <div id="quote">
                    วันนี้คุณเขียนบันทึกแล้ว กลับมารดน้ำใหม่พรุ่งนี้นะ
                </div>
            </div>
        </div>
        <div class="flex-1 min-w-full md:min-w-[50%] p-6 flex flex-col">
            <div class="flex-1" id="right-col">
                <div class="" id="bookmark">
                    <div class="px-2 py-1 rounded-t-lg border-x-2 border-t-2 border-black w-fit" id="collections">
                        <p>My Bloom Collection</p>
                    </div>
                    <div id="tools"></div>
                    <div id="market"></div>
                </div>
                <div class="text-center h-[100%] bg-[#F6EEE580] border-2 border-black" id="content-page">
                    <div class="text-center py-4">
                        <p>ทุกกลีบดอกคือวันที่คุณหันมาดูแลหัวใจตัวเอง</p>
                        <p>คุณปลูกไปแล้ว 7 ดอกจาก 3 สายพันธ์ุ</p>
                    </div>
                    <div class="overflow-auto overflow-auto flex flex-wrap justify-start gap-4 max-w-full px-10"
                        id="collection-list">
                        <div 
                            *ngFor="let f of flowers; let i = index" 
                            class="w-[calc(100%/7-1rem)] md:w-[calc(100%/4-1rem)] lg:w-[calc(100%/5-1rem)] xl:w-[calc(100%/7-1rem)] flex justify-center">
                            <img class="mx-auto block h-16 rounded-full" [src]="f.imageUrl" alt=""/>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
