<div class="bg-white rounded-2xl shadow-lg overflow-hidden max-w-6xl">
  <div class="flex flex-col md:flex-row gap-0 md:gap-4">
    <!-- Photo Area -->
    <div class="relative w-full md:w-1/2">
      <!-- Image box fixed ratio -->
      <div
        class="w-full bg-gray-100 flex items-center justify-center aspect-[4/3] md:aspect-[16/9] overflow-hidden"
        tabindex="0"
        (touchstart)="onTouchStart($event)"
        (touchend)="onTouchEnd($event)"
        (keydown)="onKeyDown($event)"
      >
        <img
          *ngIf="(photos?.length ?? 0) > 0; else noPhoto"
          [src]="photos[currentIndex]"
          alt="note photo"
          loading="lazy"
          decoding="async"
          draggable="false"
          (load)="onImageLoad($event)"
          class="max-w-full max-h-full w-auto h-auto object-contain transition-transform duration-300 hover:scale-105"
        />
      </div>

      <!-- Controls -->
      <button
        *ngIf="(photos?.length ?? 0) > 1"
        class="absolute left-3 top-1/2 -translate-y-1/2 bg-white/90 hover:bg-white rounded-full p-2 shadow-lg"
        (click)="prevPhoto()"
        aria-label="Previous photo"
      >
        ◀
      </button>
      <button
        *ngIf="(photos?.length ?? 0) > 1"
        class="absolute right-3 top-1/2 -translate-y-1/2 bg-white/90 hover:bg-white rounded-full p-2 shadow-lg"
        (click)="nextPhoto()"
        aria-label="Next photo"
      >
        ▶
      </button>

      <!-- Counter -->
      <div *ngIf="(photos?.length ?? 0) > 0" class="absolute bottom-3 left-1/2 -translate-x-1/2">
        <span class="px-2 py-1 text-xs rounded-full bg-black/60 text-white shadow">
          {{ currentIndex + 1 }} / {{ photos?.length ?? 0 }}
        </span>
      </div>

      <!-- No photo state -->
      <ng-template #noPhoto>
        <div class="flex flex-col items-center justify-center text-gray-400 py-12">
          <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="w-10 h-10 mb-2">
            <path d="M1.5 6A2.25 2.25 ..."/>
          </svg>
          <span class="text-sm">ไม่มีรูปภาพ</span>
        </div>
      </ng-template>
    </div>

    <!-- Content Area -->
    <div class="p-6 md:w-1/2 flex flex-col justify-between">
      <div>
        <h3 class="mb-2 text-lg font-bold">🌠{{ date }}</h3>
        <div class="text-amber-800">เรื่องราวดี ๆ ที่อยากขอบคุณหรืออยากเก็บไว้ในวันนี้ </div>
        <p class=" mb-2 text-gray-700 whitespace-pre-line">{{ line1 }}</p>
        <div class="text-amber-800">สิ่งเล็ก ๆ ที่ทำให้ยิ้มได้ในวันนี้ </div>
        <p class=" mb-2 text-gray-700 whitespace-pre-line">{{ line2 }}</p>
        <div class="text-amber-800">เรื่องราวที่ทำให้รู้สึกภูมิใจ </div>
        <p class=" mb-2 text-gray-700 whitespace-pre-line">{{ line3 }}</p>
      </div>

      <div class="mt-4 flex items-center justify-between gap-2">
        <span class="badge badge-soft badge-primary px-3 py-1 rounded-lg truncate">{{ mood }}</span>
        <span class="badge badge-soft badge-success px-3 py-1 text-sm truncate">{{ email }}</span>
      </div>
    </div>
  </div>
</div>
