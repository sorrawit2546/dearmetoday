<div
  class="grid gap-4 max-w-6xl mx-auto"
>
  <div
    class="p-4 rounded-lg border border-gray-200 bg-white cursor-pointer transition-all duration-300 ease-in-out"
  >
    <!-- Photo container -->
    <div class="w-full rounded-lg mb-3 relative">
      <div
        class="w-full bg-gray-100 flex items-center justify-center aspect-[4/3] md:aspect-[16/9] overflow-hidden"
        tabindex="0"
        (touchstart)="onTouchStart($event)"
        (touchend)="onTouchEnd($event)"
        (keydown)="onKeyDown($event)"
      >
        <img
          *ngIf="(photos?.length ?? 0) > 0; else noPhoto"
          [src]="photos[currentIndex]"
          alt="note photo"
          loading="lazy"
          decoding="async"
          draggable="false"
          (load)="onImageLoad($event)"
          (error)="onImageError($event)"
          class="max-w-full max-h-full w-auto h-auto object-contain transition-transform duration-300 hover:scale-105"
        />
      </div>
      <!-- Controls -->
      <button
        *ngIf="(photos?.length ?? 0) > 1"
        class="absolute left-3 top-1/2 -translate-y-1/2 bg-white/90 hover:bg-white rounded-full p-2 shadow-lg"
        (click)="prevPhoto()"
        aria-label="Previous photo"
      >
        ◀
      </button>
      <button
        *ngIf="(photos?.length ?? 0) > 1"
        class="absolute right-3 top-1/2 -translate-y-1/2 bg-white/90 hover:bg-white rounded-full p-2 shadow-lg"
        (click)="nextPhoto()"
        aria-label="Next photo"
      >
        ▶
      </button>

      <!-- Counter -->
      <div *ngIf="(photos?.length ?? 0) > 0" class="absolute bottom-3 left-1/2 -translate-x-1/2">
        <span class="px-2 py-1 text-xs rounded-full bg-black/60 text-white shadow">
          {{ currentIndex + 1 }} / {{ photos?.length ?? 0 }}
        </span>
      </div>

      <!-- No photo state -->
      <ng-template #noPhoto>
        <div class="flex flex-col items-center justify-center text-gray-400 py-12">
          <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="w-10 h-10 mb-2">
            <path d="M1.5 6A2.25 2.25 ..."/>
          </svg>
          <span class="text-sm">ไม่มีรูปภาพ</span>
        </div>
      </ng-template>
    </div>
    <!-- Date -->
    <div class="text-sm font-medium text-gray-700 mb-1 mt-4">{{ date }}</div>

    <!-- Details / Title -->
    <div class="text-sm text-gray-600">
      <div class="truncate">{{ line1 }}</div>
      <div>{{mood}}</div>
    </div>
  </div>
</div>
