<!-- Beautiful Hero Section with Cozy Design -->
<div class="relative overflow-hidden min-h-screen bg-gradient-to-br from-cozy-cream via-white to-cozy-beige">
  
  <!-- Elegant Background Pattern -->
  <div class="absolute inset-0 opacity-[0.02]">
    <svg class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="cozyPattern" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
          <circle cx="15" cy="15" r="1" fill="currentColor" opacity="0.3"/>
          <circle cx="45" cy="45" r="1.5" fill="currentColor" opacity="0.2"/>
          <path d="M30,10 Q35,20 30,30 Q25,20 30,10" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.1"/>
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#cozyPattern)" class="text-cozy-brown"/>
    </svg>
  </div>

  <!-- Floating Ambient Elements -->
  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-1/4 left-1/6 w-48 h-48 bg-gradient-radial from-cozy-blush/10 via-cozy-sage/5 to-transparent rounded-full animate-pulse" style="animation-duration: 8s;"></div>
    <div class="absolute top-1/3 right-1/4 w-32 h-32 bg-gradient-radial from-amber-100/15 via-cozy-warm-white/10 to-transparent rounded-full animate-pulse" style="animation-duration: 6s; animation-delay: 2s;"></div>
    <div class="absolute bottom-1/3 left-1/3 w-24 h-24 bg-gradient-radial from-cozy-lavender/8 to-transparent rounded-full animate-pulse" style="animation-duration: 10s; animation-delay: 4s;"></div>
  </div>

  <!-- Main Content Container -->
  <div class="relative flex flex-col items-center justify-center px-8 py-24 text-center min-h-screen">
    
    <!-- Sophisticated Icon Design -->
    <div class="relative mb-16 group">
      <!-- Outer Glow Ring -->
      <div class="absolute inset-0 w-32 h-32 -translate-x-4 -translate-y-4">
        <div class="w-full h-full rounded-full bg-gradient-to-r from-cozy-brown/10 via-amber-200/15 to-cozy-blush/10 animate-spin" style="animation-duration: 20s;"></div>
      </div>
      
      <!-- Main Icon Container -->
      <div class="relative">
        <!-- Backdrop Circle -->
        <div class="w-24 h-24 rounded-full bg-gradient-to-br from-white via-cozy-warm-white to-cozy-beige shadow-lg border border-cozy-sage/20 flex items-center justify-center backdrop-blur-sm group-hover:scale-105 transition-transform duration-500">
          
          <!-- Inner Gradient Circle -->
          <div class="w-16 h-16 rounded-full bg-gradient-to-br from-cozy-brown/5 via-cozy-blush/10 to-cozy-brown/5 flex items-center justify-center relative overflow-hidden">
            
            <!-- Pen Icon -->
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                class="text-cozy-brown relative z-10 group-hover:scale-110 transition-transform duration-300">
              <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" />
            </svg>
            
            <!-- Subtle Shimmer Effect -->
            <div class="absolute inset-0 bg-gradient-to-tr from-transparent via-white/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500 transform rotate-45"></div>
          </div>
        </div>
        
        <!-- Decorative Floating Dots -->
        <div class="absolute -top-1 -right-1 w-3 h-3 bg-cozy-brown/60 rounded-full animate-ping"></div>
        <div class="absolute -bottom-2 -left-2 w-2 h-2 bg-amber-400/70 rounded-full animate-ping" style="animation-delay: 1s;"></div>
        <div class="absolute top-1/2 -right-3 w-1.5 h-1.5 bg-cozy-blush rounded-full animate-ping" style="animation-delay: 0.5s;"></div>
      </div>
    </div>

    <!-- Elegant Typography Section -->
    <div class="max-w-5xl mx-auto space-y-12">
      
      <!-- Main Heading with Premium Effects -->
      <div class="space-y-6">
        <h1 class="text-5xl md:text-7xl lg:text-8xl font-light tracking-tight leading-none">
          <span class="bg-gradient-to-r from-cozy-charcoal via-cozy-brown to-cozy-dark-brown bg-clip-text text-transparent font-english">
            Dear me today
          </span>
        </h1>
        
        <!-- Elegant Divider -->
        <div class="flex items-center justify-center space-x-4">
          <div class="w-16 h-px bg-gradient-to-r from-transparent via-cozy-brown/40 to-transparent"></div>
          <div class="w-2 h-2 rounded-full bg-cozy-brown/30"></div>
          <div class="w-16 h-px bg-gradient-to-l from-transparent via-cozy-brown/40 to-transparent"></div>
        </div>
      </div>

      <!-- Beautiful Subtitle -->
      <div class="space-y-8">
        <h2 class="text-2xl md:text-3xl lg:text-4xl text-cozy-charcoal/80 font-light font-english leading-relaxed max-w-4xl mx-auto">
          เขียนบันทึกความคิดดี ๆ<br>
          <span class="text-cozy-brown/90 font-normal">สร้างวันพรุ่งนี้ที่สดใส</span>
        </h2>
        
        <p class="text-lg md:text-xl text-cozy-brown/70 font-light font-english max-w-2xl mx-auto leading-relaxed">
          A beautiful space to capture your positive thoughts<br>
          and build a brighter tomorrow, one note at a time
        </p>
      </div>

      <!-- Inspirational Quote -->
      <div class="relative py-8">
        <div class="absolute left-1/2 transform -translate-x-1/2 w-px h-20 bg-gradient-to-b from-transparent via-cozy-brown/20 to-transparent"></div>
        <blockquote class="text-base md:text-lg text-cozy-charcoal/60 font-light italic font-english max-w-xl mx-auto leading-relaxed relative">
          "วันนี้คือโอกาสใหม่ในการสร้างความคิดบวก<br>
          <span class="text-cozy-brown/80 not-italic">Today is a new opportunity to create positive thoughts</span>"
        </blockquote>
      </div>
    </div>

    <!-- Premium Call-to-Action Button -->
    <div class="mt-16 relative group">
      <!-- Button Background Glow -->
      <div class="absolute inset-0 bg-gradient-to-r from-cozy-brown/20 via-cozy-dark-brown/30 to-cozy-brown/20 rounded-2xl blur-xl opacity-40 group-hover:opacity-60 transition-opacity duration-500 scale-110"></div>
      
      <!-- Main Button -->
      <button (click)="handleShowForm()"
              class="relative overflow-hidden bg-gradient-to-r from-cozy-brown to-cozy-dark-brown text-white px-12 py-5 rounded-2xl shadow-lg hover:shadow-xl transition-all duration-500 transform hover:scale-105 hover:-translate-y-1 group">
        
        <!-- Button Content -->
        <span class="relative flex items-center space-x-4 font-thai text-lg font-normal">
          <span>เริ่มต้นเขียนบันทึก</span>
          <svg class="w-5 h-5 transition-transform group-hover:translate-x-1 duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"></path>
          </svg>
        </span>
        
        <!-- Hover Shine Effect -->
        <div class="absolute top-0 left-0 w-full h-full bg-gradient-to-r from-transparent via-white/20 to-transparent transform -skew-x-12 -translate-x-full group-hover:translate-x-full transition-transform duration-1000"></div>
        
        <!-- Button Border Highlight -->
        <div class="absolute inset-0 rounded-2xl border border-white/20 group-hover:border-white/30 transition-colors duration-300"></div>
      </button>
    </div>

    <!-- Subtle Scroll Indicator -->
    <div class="absolute bottom-8 left-1/2 transform -translate-x-1/2 animate-bounce">
      <div class="flex flex-col items-center space-y-2 opacity-60 hover:opacity-100 transition-opacity duration-300">
        <div class="w-6 h-10 border-2 border-cozy-brown/30 rounded-full flex justify-center py-2">
          <div class="w-1 h-2 bg-cozy-brown/50 rounded-full animate-pulse"></div>
        </div>
        <span class="text-xs text-cozy-brown/60 font-light font-thai">เลื่อนลงเพื่อเริ่มต้น</span>
      </div>
    </div>

  </div>
</div>
