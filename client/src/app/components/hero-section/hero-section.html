<div class="min-h-screen bg-[#f5f5f5] relative">
  <!-- Gradient overlay at bottom -->
  <div
    class="absolute inset-0 bg-gradient-to-b from-transparent from-60% to-[#C6E2FF]"
  ></div>

  <div class="relative z-10">
    <!-- Navigation -->
    <nav class="flex items-center justify-between px-6 py-4">
      <div class="flex items-center space-x-6"></div>
      <div class="flex items-center space-x-3">
        <button
          type="button"
          class="btn btn-soft btn-primary border border-[#ac7f5e] px-4 py-2 rounded"
          routerLink="/login"
        >
          Sign In
        </button>
        <button
          type="button"
          class="btn btn-soft btn-primary bg-[#2c2c2c] text-[#ffffff] hover:bg-[#1e1e1e] px-4 py-2 rounded"
          routerLink="/aboutdearme"
        >
          About
        </button>
        <a routerLink="/privacy">Privacy | </a>
        <a routerLink="/terms">Terms</a>
      </div>
    </nav>

    <!-- Hero Section -->
    <div
      class="flex flex-col items-center justify-center px-6 py-32 text-center min-h-[80vh]"
    >
      <div class="flex justify-center">
        <img
          src="assets/images/dearme,logo.png"
          alt=""
          class="h-10 w-16 md:h-20 md:w-32 mb-4"
        />
      </div>
      <h1 class="text-4xl md:text-5xl font-bold text-[#000000] mb-2">
        Dear me, Today..
      </h1>
      <h2 class="text-3xl md:text-4xl font-bold text-[#000000] mb-4">
        Keep smiling and stay <span class="text-blue-600">positive!</span>
      </h2>
      <p class="text-[#323330] text-lg mb-8 w-full">
        วันนี้เหนื่อยไหม มีอะไรดี ๆ เกิดขึ้นบ้างนะ ลองเขียนเก็บไว้ดูไหม :)
      </p>
      <button
        (click)="navigateToGoogleProvide()"
        class="btn btn-primary px-8 py-3 text-lg rounded-md"
      >
        เริ่มบันทึกเรื่องราวดี ๆ ของคุณ
      </button>
      <div class="flex w-lg flex-col">
        <div class="divider">or</div>
      </div>
      <div class="join">
        <div>
          <label class="input validator join-item rounded-l-lg">
            <svg
              class="h-[1em] opacity-50"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
            >
              <g
                stroke-linejoin="round"
                stroke-linecap="round"
                stroke-width="2.5"
                fill="none"
                stroke="currentColor"
              >
                <rect width="20" height="16" x="2" y="4" rx="2"></rect>
                <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
              </g>
            </svg>
            <input
              #msg="ngModel"
              [ngModel]="quickNoteFromLocalStorage()"
              (ngModelChange)="quickNoteFromLocalStorage.set($event)"
              class="placeholder:text-blue-300 text-blue-500"
              type="text"
              placeholder="สิ่งที่อยากขอบคุณในวันนี้"
              required
            />
          </label>
        </div>
        <button
          (click)="sendThankMessage(msg.value)"
          class="btn btn-neutral join-item rounded-r-lg"
        >
          Send
        </button>
      </div>
      <!-- Features Section -->
      <div class="mt-6">
        <!-- <a routerLink="/aboutdearme" class="text-[12px] text-blue-600 hover:underline">
          Learn more about Dearme,Today
        </a> -->
      </div>
      <!-- Shared Toast Component -->
      <app-toast></app-toast>
    </div>
  </div>
</div>
