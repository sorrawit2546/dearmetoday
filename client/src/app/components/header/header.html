<div class="navbar bg-base-100 shadow-sm pl-24 pr-24">
  <a href="" class="justify-center items-center ml-16">
    <img src="assets/images/dearme,logo.png" alt="" class=" h-14 w-14">
  </a>
  <div class="flex-1 space-x-10">
    <a
      routerLink="/dashboard"
      routerLinkActive="active-tab"
      [routerLinkActiveOptions]="{ exact: true }"
      class="text-xl font-bold px-3 py-2 rounded-lg transition-colors hover:bg-purple-100 pr-3"
      >Dashboard</a
    >
    <a href="/community" class="text-xl font-bold">Community</a>
  </div>
  <div class="flex gap-2">
    <div class="dropdown dropdown-end">
      <div tabindex="0" role="button" class="btn btn-ghost m-1 rounded-2xl" (click)="markQuickNotesRead()" (focus)="markQuickNotesRead()">
        <div class="relative">
          <img
            src="assets/images/freeze-message-box-snow-svgrepo-com.svg"
            alt="freez-message"
            alt="error icon"
            class="swap-off fill-current h-10 w-10"
          />
          @if (unreadQuickNotes()) {
            <span class="status status-info animate-bounce absolute -top-1 -right-1 h-3 w-3 rounded-full"></span>
          }
        </div>
      </div>
      <ul
        tabindex="0"
        class="dropdown-content menu bg-base-100 rounded-xl z-1 w-52 p-2 shadow-sm"
        (mouseenter)="markQuickNotesRead()"
      >
      @if(quickNoteMessage() ; as quickNotes){
        @for(quicknote of quickNotes; track quicknote.id){
          <div class="border-dashed border-1 rounded-lg my-1 border-accent">
            <li class="">
              <a>{{quicknote.thankMessage}}</a>
              <span class="badge badge-soft badge-info rounded-lg h-8 px-2">{{quicknote.createdAt | date:'EEEE d, MMMM'}}</span>
            </li>
          </div>
        }
      }
      </ul>
    </div>
    <div class="dropdown dropdown-end">
      <div tabindex="0" role="button" class="btn btn-ghost btn-circle avatar">
        <div class="w-10 rounded-full">
          <img
            *ngIf="user()?.avatarUrl"
            [src]="user()?.avatarUrl"
            [alt]="user()?.name"
          />
        </div>
      </div>
      <ul
        tabindex="0"
        class="menu menu-sm dropdown-content bg-base-100 rounded-box z-10 mt-3 w-52 p-2 shadow"
      >
        <li class="menu-title">{{ user()?.name }}</li>
        <li><button (click)="logout()">Logout</button></li>
      </ul>
    </div>
  </div>
</div>
