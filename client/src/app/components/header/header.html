<!-- Cozy Minimal Header -->
<header class="fixed top-0 left-0 right-0 z-50 glass-cozy border-b border-stone-200/50">
  <nav class="flex items-center justify-between px-8 py-6 max-w-6xl mx-auto">
    <!-- Minimal Logo -->
    <div class="flex items-center">
      <a routerLink="/" class="flex items-center space-x-3">
        <div class="w-8 h-8 rounded-full bg-gradient-to-br from-amber-100 to-orange-200 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
               class="text-amber-700">
            <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" />
          </svg>
        </div>
        <span class="text-lg font-light text-stone-600 font-english">Dear Me Today</span>
      </a>
    </div>

    <!-- Minimal Navigation -->
    <div class="hidden md:flex items-center space-x-10">
      <a routerLink="/about" class="text-stone-500 hover:text-stone-700 transition-colors font-english font-light text-sm">
        About
      </a>
      <a routerLink="/how-it-works" class="text-stone-500 hover:text-stone-700 transition-colors font-english font-light text-sm">
        How it Works
      </a>
    </div>
  
    <!-- Cozy Auth Button -->
    <div class="flex items-center">
      <button routerLink="/login"
              class="text-stone-500 hover:text-stone-700 transition-colors font-english font-light text-sm mr-6 hidden sm:block">
        Sign In
      </button>
      <button routerLink="/register" 
              class="cozy-button text-sm font-english font-light px-6 py-2 hover:scale-105 transition-all duration-300">
        Get Started
      </button>
    </div>

    <!-- Mobile Menu Button -->
    <div class="md:hidden ml-4">
      <button class="text-stone-500 hover:text-stone-700 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
    </div>
  </nav>
</header>

<!-- Spacer -->
<div class="h-20"></div>
