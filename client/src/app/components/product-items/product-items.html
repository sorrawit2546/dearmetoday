<div
  class="group relative flex w-[320px] flex-col overflow-hidden rounded-xl border border-gray-200 bg-white shadow-sm
         transition-transform duration-300 ease-out will-change-transform
         hover:scale-105 hover:shadow-lg"
>
  <!-- Image -->
  <div class="relative h-[400px] w-full overflow-hidden bg-gray-100">
    <img
      [src]="titleName().image"
      [alt]="titleName().title"
      class="h-full w-full object-cover transition-transform duration-300 ease-out group-hover:scale-110"
    />

    <!-- Overlay + Button -->
    <div
      class="absolute inset-0 flex items-center justify-center bg-black/40
             opacity-0 transition-opacity duration-300 group-hover:opacity-100"
    >
      <button (click)="goToDetails(titleName().id)"
        class="rounded-lg bg-white px-4 py-2 text-sm font-medium text-gray-800
               transition hover:bg-gray-100"
      >
        ดูรายละเอียด
      </button>
    </div>
  </div>

  <!-- Content -->
  <div class="flex flex-col gap-2 p-4">
    <h1 class="text-lg font-semibold leading-tight">
      {{ titleName().title }}
    </h1>

    <p class="text-sm text-gray-500">
      {{ titleName().describe }}
    </p>
  </div>
</div>
