<!-- 🪄 Onboarding Popup -->
<div
  *ngIf="showPopup"
  class="fixed inset-0 bg-black/50 backdrop-blur-sm flex justify-center items-center z-50 animate-fadeIn"
>
  <div
    class="relative bg-[#FFFDF8] border-2 border-[#E5D7C0] rounded-[24px] shadow-[8px_10px_0_#E0D4B2] w-[95%] max-w-[95vw] sm:max-w-2xl lg:max-w-4xl p-4 sm:p-8 text-center overflow-x-hidden overflow-y-auto max-h-[90vh]"
  >
    <h1
      class="text-2xl sm:text-3xl md:text-4xl font-bold mb-6 sm:mb-8 text-[#5A4A3B]"
    >
      How To!
    </h1>

    <!-- ปุ่มปิด -->
    <button
      (click)="closePopup()"
      class="absolute top-3 right-3 text-[#B8A98C] hover:text-[#5C5042] text-2xl sm:text-3xl"
    >
      ✕
    </button>

    <!-- 🪄 เนื้อหาสไลด์ -->
    <div
      class="relative min-h-[380px] sm:min-h-[420px] overflow-hidden flex items-center justify-center w-full"
    >
      <div
        class="flex transition-transform duration-500 ease-in-out w-full"
        [style.transform]="'translateX(-' + currentSlide * 100 + '%)'"
        [style.width.%]="slides.length * 100"
      >
        <!-- ✅ Template for each slide -->
        <div
          *ngFor="let slide of slides"
          class="w-full flex-shrink-0 px-4 sm:px-6 flex flex-col items-center justify-center space-y-3 text-center box-border"
        >
          <img
            [src]="slide.image"
            [alt]="slide.title"
            class="w-full max-w-[360px] sm:max-w-[480px] h-auto max-h-[50vh] sm:max-h-[60vh] object-contain mb-3 mx-auto"
          />
          <h2
            class="text-base sm:text-xl md:text-2xl font-semibold text-[#5A4A3B] break-words px-2 sm:px-4"
          >
            {{ slide.title }}
          </h2>
          <p
            class="text-xs sm:text-base md:text-lg text-[#6B5C4C] leading-relaxed px-4 sm:px-6 break-words whitespace-normal"
          >
            {{ slide.description }}
          </p>
        </div>
      </div>
    </div>

    <!-- ปุ่มเลื่อน -->
    <div class="flex justify-between items-center mt-2 px-4">
      <button
        (click)="prevSlide()"
        class="text-[#A7977C] hover:text-[#5A4A3B] text-4xl sm:text-6xl font-bold"
      >
        ‹
      </button>

      <!-- จุดสถานะ -->
      <div class="flex gap-2">
        <div
          *ngFor="let slide of slides; let i = index"
          class="w-2.5 sm:w-3 h-2.5 sm:h-3 rounded-full transition-all duration-300"
          [class.bg-[#20B2AA]]="i === currentSlide"
          [class.bg-[#D6CDBB]]="i !== currentSlide"
        ></div>
      </div>

      <button
        (click)="nextSlide()"
        class="text-[#A7977C] hover:text-[#5A4A3B] text-4xl sm:text-6xl font-bold"
      >
        ›
      </button>
    </div>

    <!-- ปุ่มปิดท้าย -->
    <div class="mt-2">
      <button
        *ngIf="currentSlide === slides.length - 1"
        (click)="closePopup()"
        class="bg-[#20B2AA] text-white px-5 sm:px-8 py-2 sm:py-3 rounded-full font-semibold hover:scale-105 transition"
      >
        Got it 🌼
      </button>
    </div>
  </div>
</div>
