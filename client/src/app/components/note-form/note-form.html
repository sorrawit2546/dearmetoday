<!-- Note Form -->
<div id="note-form" class="px-6">
  <div class="max-w-2xl mx-auto">
    <div class="bg-[#ffffff] rounded-3xl shadow-lg p-6">
      <!-- Date Header -->
      <div class="text-sm text-gray-600 mb-4">{{formattedDate}}</div>

      <!-- Dropzone with preview inside -->
      <div
        class="relative w-full h-[300px] border-2 border-dashed border-gray-300 rounded-lg bg-gray-50 hover:bg-gray-100 overflow-hidden group cursor-pointer"
        (drop)="handleDrop($event)"
        (dragover)="handleDragOver($event)"
        (dragleave)="handleDragLeave($event)"
        [class.border-blue-400]="isDragging"
        (click)="fileInput.click()"
      >
        <!-- Image previews (in grid) -->
        <ng-container *ngIf="previewImages.length > 0; else dropHint">
          <div class="w-full h-full grid grid-cols-5 gap-5 p-2">
            <div
              *ngFor="let img of previewImages; let i = index"
              class="relative h-full aspect-square rounded overflow-hidden border"
            >
              <img [src]="img" class="w-full h-full object-cover" />
              <button
                type="button"
                (click)="removeImage(i); $event.stopPropagation()"
                class="absolute top-1 right-1 bg-black/60 text-white text-xs px-1 py-0.5 rounded-full hover:bg-red-600"
              >
                ✕
              </button>
            </div>
          </div>
        </ng-container>

        <!-- Drop hint if no images -->
        <ng-template #dropHint>
          <div
            class="flex flex-col items-center justify-center h-full text-gray-500"
          >
            <p class="text-center">
              Drag & drop images here<br />
              or <span class="font-medium text-blue-600">click to upload</span>
              <br />
              <span class="text-sm">(up to 5 images)</span>
            </p>
          </div>
        </ng-template>

        <!-- Hidden file input -->
        <input
          type="file"
          accept="image/*"
          multiple
          hidden
          #fileInput
          (change)="handleImageUpload($event)"
        />
      </div>

      <!-- Email Field -->
      <!-- <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1"
          >Email
        </label>
        <input
          type="email"
          placeholder="example@gmail.com"
          [(ngModel)]="email"
          class="w-full border rounded px-3 py-2"
        />
      </div> -->

      <!-- Positive Note Field -->
      <div class="mb-3 mt-3">
        <label class="block text-sm font-medium text-gray-700 mb-1"
          >Positive note for today.</label
        >
        <div class="grid grid-cols-2 gap-4">
          <textarea
          placeholder="เรื่องราวดี ๆ ที่อยากขอบคุณหรืออยากเก็บไว้ในวันนี้..."
          [(ngModel)]="note"
          class="col-span-2 h-20 resize-none border rounded px-3 py-2 text-gray-700"
          ></textarea>
          <textarea
          placeholder="สิ่งเล็ก ๆ ที่ทำให้คุณยิ้มได้ในวันนี้..."
          [(ngModel)]="note2"
          class="w-full h-20 resize-none border rounded px-3 py-2 text-gray-700"
          ></textarea>
          <textarea
          placeholder="เรื่องราวที่ทำให้รู้สึกภูมิใจ.."
          [(ngModel)]="note3"
          class="w-full h-20 resize-none border rounded px-3 py-2 text-gray-700"
          ></textarea>
        </div>
      </div>

      <!-- Mood Selector -->
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-1">Mood</label>
        <select [(ngModel)]="mood" class="w-full border rounded px-3 py-2">
          <option value="happy">happy</option>
          <option value="calm">calm</option>
          <option value="neutral">neutral</option>
          <option value="tired">tired</option>
          <option value="sad">sad</option>
        </select>
      </div>

      <!-- Submit Button -->
      <button
        (click)="submitForm()"
        class="btn btn-soft btn-primary w-full"
        [disabled]="isLoading"
      >
        <span *ngIf="!isLoading">Submit</span>
        <span *ngIf="isLoading" class="loading loading-dots loading-md"></span>
      </button>
      <div
        *ngIf="toastMessage()"
        class="toast toast-top toast-end z-50 transition-all duration-500 ease-in-out"
      >
        <div
          class="alert shadow-lg flex items-center gap-3 rounded-xl p-4"
          [ngClass]="toastError() ? 'alert-error' : 'alert-success'"
        >
          <!-- Icon -->
          <svg
            *ngIf="toastError(); else successIcon"
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6 shrink-0"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.054 0
           1.986-.816 2.07-1.866L21.86 7.134A2.072
           2.072 0 0019.79 5H4.21c-1.054 0-1.986.816-2.07
           1.866l-1.072 12a2.072 2.072 0 002.07
           2.134z"
            />
          </svg>
          <ng-template #successIcon>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-6 w-6 shrink-0"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M5 13l4 4L19 7"
              />
            </svg>
          </ng-template>

          <!-- Message -->
          <span class="font-medium text-base">{{ toastMessage() }}</span>
        </div>
      </div>

      <!-- Confirm Modal -->
      <dialog #confirmDialog class="modal">
        <div class="modal-box rounded-2xl">
          <h3 class="font-bold text-lg">ยืนยันการส่งข้อความ?</h3>
          <p class="py-2">ระบบจะทำการส่งอีเมล พร้อมข้อความและรูปภาพของคุณไปยัง</p>
          <p class="py-2">{{email}}</p>
          <fieldset class=" fieldset bg-base-100 border-base-300 rounded-2xl w-64 border p-4">
            <legend class="fieldset-legend">Share to community?</legend>
            <label class="label">
              <input [(ngModel)]="showMessage" type="checkbox" class="checkbox checkbox-info rounded-2xl" />
              of couse
            </label>
          </fieldset>
          <div class="modal-action">
            <form method="dialog" class="flex gap-2">
              <button class="btn rounded-2xl" (click)="cancelSend()">ยกเลิก</button>
              <button class="btn btn-primary rounded-2xl" (click)="confirmSend()">
                ยืนยัน
              </button>
            </form>
          </div>
        </div>
      </dialog>
    </div>
  </div>
</div>
