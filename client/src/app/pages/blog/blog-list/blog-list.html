<!-- Navigation -->
<nav
  class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-[#EAE4DA]"
>
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="flex h-16 items-center justify-between">
      <!-- Brand -->
      <a
        routerLink="/"
        class="text-2xl sm:text-3xl font-bold tracking-tight text-[#2c2c2c]"
      >
        Dearme,Today
      </a>

      <!-- Desktop actions -->
      <div class="hidden md:flex items-center gap-4">
        <a
          routerLink="/privacy"
          class="text-sm text-[#5C5042] hover:text-[#2c2c2c]"
          >Privacy</a
        >
        <span class="text-[#C8BFB0]">|</span>
        <a
          routerLink="/terms"
          class="text-sm text-[#5C5042] hover:text-[#2c2c2c]"
          >Terms</a
        >

        <button
          type="button"
          class="text-[#20b2aa] border-2 rounded-3xl border-[#20b2aa] px-4 py-2 bg-white hover:text-[#333] transition"
          routerLink="/login"
        >
          Join Now
        </button>
        <button
          type="button"
          class="rounded-3xl bg-[#2c2c2c] text-white hover:bg-[#1e1e1e] px-4 py-2 transition"
          routerLink="/aboutdearme"
        >
          About
        </button>
      </div>

      <!-- Mobile hamburger -->
      <button
        type="button"
        class="md:hidden inline-flex items-center justify-center rounded-xl p-2 border border-[#EAE4DA] text-[#4C4030] hover:bg-[#F6F2EA] transition"
        aria-label="Open menu"
        aria-controls="mobile-menu"
        [attr.aria-expanded]="isMenuOpen()"
        (click)="toggleMenu()"
      >
        <svg
          *ngIf="!isMenuOpen()"
          xmlns="http://www.w3.org/2000/svg"
          class="h-6 w-6"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M4 6h16M4 12h16M4 18h16"
          />
        </svg>
        <svg
          *ngIf="isMenuOpen()"
          xmlns="http://www.w3.org/2000/svg"
          class="h-6 w-6"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>
  </div>

  <!-- Mobile menu -->
  <div id="mobile-menu" class="md:hidden" *ngIf="isMenuOpen()">
    <div class="space-y-2 px-4 pb-4">
      <a
        routerLink="/aboutdearme"
        class="block rounded-xl px-4 py-3 text-[#4C4030] bg-white border border-[#EAE4DA]"
      >
        About
      </a>
      <a
        routerLink="/privacy"
        class="block rounded-xl px-4 py-3 text-[#4C4030] hover:bg-[#F6F2EA] border border-transparent"
      >
        Privacy
      </a>
      <a
        routerLink="/terms"
        class="block rounded-xl px-4 py-3 text-[#4C4030] hover:bg-[#F6F2EA] border border-transparent"
      >
        Terms
      </a>
      <div class="flex gap-3 pt-1">
        <button
          type="button"
          class="flex-1 text-[#20b2aa] border-2 rounded-2xl border-[#20b2aa] px-4 py-2 bg-white hover:text-[#333] transition"
          routerLink="/login"
          (click)="closeMenu()"
        >
          Join Now
        </button>
        <button
          type="button"
          class="flex-1 rounded-2xl bg-[#2c2c2c] text-white hover:bg-[#1e1e1e] px-4 py-2 transition"
          routerLink="/aboutdearme"
          (click)="closeMenu()"
        >
          About
        </button>
      </div>
    </div>
  </div>
</nav>
<div class="max-w-5xl mx-auto px-6 py-12 font-['Sarabun'] text-[#5C5042]">
  <!-- Heading -->
  <h1
    class="text-3xl md:text-4xl font-bold text-center mb-10 text-[#4C4030] font-['Goudy Bookletter 1911']"
  >
    บทความจาก Dearme,Today
  </h1>

  <!-- Loading -->
  <div *ngIf="isLoading" class="text-center text-[#9B8E7B] py-12 italic">
    กำลังโหลดบทความ...
  </div>

  <!-- Posts Grid -->
  <div
    *ngIf="!isLoading && posts.length > 0"
    class="grid gap-8 md:grid-cols-2 lg:grid-cols-3"
  >
    <div
      *ngFor="let post of posts"
      class="group relative bg-[#FFFDF8] rounded-[28px] overflow-hidden border border-[#EAE4DA] shadow-[0_4px_14px_rgba(0,0,0,0.06)] hover:shadow-[0_6px_18px_rgba(0,0,0,0.08)] transition-all duration-300 ease-out cursor-pointer"
      [routerLink]="['/blog', post.slug]"
    >
      <!-- Cover -->
      <div class="overflow-hidden h-56 bg-[#F5F2EB]">
        <img
          *ngIf="post.cover"
          [src]="post.cover"
          alt="{{ post.title }}"
          class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
        />
      </div>

      <!-- Card Content -->
      <div class="p-6">
        <h2
          class="text-xl font-semibold text-[#5A4A3B] mb-2 leading-snug group-hover:text-[#907D62] transition-colors"
        >
          {{ post.title }}
        </h2>

        <p class="text-[#7A6C5E] text-sm mb-4 line-clamp-3">
          {{ post.description }}
        </p>

        <p class="text-xs text-[#9B8E7B] italic">
          เขียนเมื่อ {{ post.date | date: 'longDate' }}
        </p>
      </div>

      <!-- Notebook holes -->
      <div
        class="absolute left-[-10px] top-6 flex flex-col gap-8 items-center opacity-60"
      >
        <div class="w-3 h-3 rounded-full bg-[#E0D7C3] shadow-inner"></div>
        <div class="w-3 h-3 rounded-full bg-[#E0D7C3] shadow-inner"></div>
        <div class="w-3 h-3 rounded-full bg-[#E0D7C3] shadow-inner"></div>
      </div>
    </div>
  </div>

  <!-- Empty state -->
  <div
    *ngIf="!isLoading && posts.length === 0"
    class="text-center text-[#9B8E7B] py-12 italic"
  >
    ไม่พบบทความ
  </div>
</div>
<app-footer></app-footer>
