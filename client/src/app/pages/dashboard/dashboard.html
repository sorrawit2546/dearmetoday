<div class="dashboard-container">
  <!-- Debug Info -->
  <div class="debug-info" style="background: #f0f0f0; padding: 10px; margin-bottom: 20px; border-radius: 5px;">
    <h4>Debug Information:</h4>
    <p><strong>Loading:</strong> {{ isLoading }}</p>
    <p><strong>Error:</strong> {{ error }}</p>
    <p><strong>User:</strong> {{ user ? 'Loaded' : 'Not loaded' }}</p>
    <p><strong>Retry Count:</strong> {{ retryCount }}</p>
  </div>

  <!-- Loading State -->
  <div *ngIf="isLoading" class="loading-state">
    <div class="loading-spinner"></div>
    <p>กำลังโหลดข้อมูล...</p>
  </div>

  <!-- Error State -->
  <div *ngIf="error && !isLoading" class="error-state">
    <div class="error-message">
      <h3>เกิดข้อผิดพลาด</h3>
      <p>{{ error }}</p>
      <button (click)="retry()" class="retry-btn">ลองใหม่</button>
    </div>
  </div>

  <!-- User Data -->
  <div *ngIf="user && !isLoading && !error" class="user-info">
    <div class="header-section">
      <h1>ยินดีต้อนรับ {{ user.name }}!</h1>
      <button (click)="logout()" class="logout-btn">ออกจากระบบ</button>
    </div>
    <div class="user-details">
      <img *ngIf="user.avatarUrl" [src]="user.avatarUrl" [alt]="user.name" class="avatar">
      <div class="user-text">
        <p><strong>อีเมล:</strong> {{ user.email }}</p>
        <p><strong>User ID:</strong> {{ user.userId }}</p>
      </div>
    </div>
  </div>
</div>
