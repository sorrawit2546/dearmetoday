<div class="dashboard-container">
  <!-- Loading State -->
  <div *ngIf="isLoading" class="loading-state">
    <div class="loading-spinner"></div>
    <p>กำลังโหลดข้อมูล...</p>
  </div>

  <!-- Error State -->
  <div *ngIf="error && !isLoading" class="error-state">
    <div class="error-message">
      <h3>เกิดข้อผิดพลาด</h3>
      <p>{{ error }}</p>
      <button (click)="retry()" class="retry-btn">ลองใหม่</button>
    </div>
  </div>

  <!-- User Data -->
  <div
    *ngIf="user && !isLoading && !error"
    class="bg-[#ffffff] rounded-3xl shadow-lg p-6"
  >
    <!-- 🟦 Header Section (modern design) -->
    <div class="flex items-center justify-between mb-6">
      <div class="flex items-center gap-4">
        <img
          *ngIf="user.avatarUrl"
          [src]="user.avatarUrl"
          [alt]="user.name"
          class="w-14 h-14 rounded-full border border-gray-200 shadow-sm"
        />
        <div>
          <h1 class="text-xl font-semibold text-gray-800">Welcome back,</h1>
          <p class="text-lg font-bold text-blue-600">{{ user.name }}</p>
        </div>
      </div>
      <button
        (click)="logout()"
        class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium px-4 py-2 rounded-lg shadow-sm transition duration-150"
      >
        Logout
      </button>
    </div>

    <!-- 📧 User Details -->
    <div class="text-sm text-gray-600">
      <p><strong>Email:</strong> {{ user.email }}</p>
    </div>
    <app-note-form></app-note-form>
  </div>
</div>
