<div class="dashboard-container">
  <!-- Loading State -->
  <div *ngIf="isLoading" class="loading-state ">
    <div class="loading loading-dots loading-xl"></div>
    <p>กำลังโหลดข้อมูล...</p>
  </div>

  <!-- Error State -->
  <div *ngIf="error && !isLoading" class="error-state">
    <div class="error-message">
      <h3>เกิดข้อผิดพลาด</h3>
      <p>{{ error }}</p>
      <button (click)="retry()" class="retry-btn">ลองใหม่</button>
    </div>
  </div>

  <!-- User Data -->
  <div
    *ngIf="user && !isLoading && !error"
    class=""
  >
    <!-- 🟦 Header Section (modern design) -->
    <!-- <div class="navbar bg-base-100 rounded-2xl mb-6 px-2 sm:px-4 justify-end-safe">
      <div class="flex-none ">
        <div class="dropdown dropdown-end">
          <div tabindex="0" role="button" class="btn btn-ghost btn-circle avatar">
            <div class="w-10 rounded-full">
              <img *ngIf="user.avatarUrl" [src]="user.avatarUrl" [alt]="user.name" />
            </div>
          </div>
          <ul tabindex="0" class="menu menu-sm dropdown-content bg-base-100 rounded-box z-10 mt-3 w-52 p-2 shadow">
            <li class="menu-title">{{ user.name }}</li>
            <li><button (click)="logout()">Logout</button></li>
          </ul>
        </div>
      </div>
    </div> -->

    <div class="navbar bg-base-100 shadow-sm">
      <div class="flex-1">
        <a class="btn btn-ghost text-xl">dearmetoday</a>
      </div>
      <div class="flex gap-2">
        <div class="dropdown dropdown-end">
          <div tabindex="0" role="button" class="btn btn-ghost btn-circle avatar">
            <div class="w-10 rounded-full">
              <img *ngIf="user.avatarUrl" [src]="user.avatarUrl" [alt]="user.name" />
            </div>
          </div>
          <ul tabindex="0" class="menu menu-sm dropdown-content bg-base-100 rounded-box z-10 mt-3 w-52 p-2 shadow">
            <li class="menu-title">{{ user.name }}</li>
            <li><button (click)="logout()">Logout</button></li>
          </ul>
        </div>
      </div>
    </div>

    <div class="flex flex-col justify-center items-center mt-7">
      <div class="w-full max-w-6xl flex justify-start text-2xl">
        <div class="flex flex-row">
          <img class="w-[30px] h-[30px]" src="assets/images/mail.png" alt=""><span class="pl-1.5 font-bold">Overview Section</span>
        </div>
      </div>
      <div role="alert" class="bg-white flex flex-row h-20 items-center px-5 space-x-3 rounded-[10px] mb-4 w-full max-w-6xl shadow-md">
        <span class="relative flex size-3">
          <span class="absolute inline-flex h-full w-full animate-ping rounded-full bg-sky-400 opacity-75"></span>
          <span class="relative inline-flex size-3 rounded-full bg-sky-500"></span>
        </span>
        <div>
          <h3 class="font-bold">คุณได้เขียนบันทึกเชิงบวกของชีวิตในแต่ละวันไปแล้ว <span>{{countNote}}</span> ฉบับ!</h3>
          <div class="text-xs">นั่นมันมีความหมายมาก อย่าลืมกลับมาเขียนอีกนะ</div>
        </div>
      </div>
      <div class="w-full max-w-6xl flex justify-start text-2xl my-4">
        <img class="w-[30px] h-[30px]" src="assets/images/christmas-tree.png" alt=""><span class="pl-1.5 font-bold">Recent Notes</span>
      </div>
      <app-note-card
        [date]="(entry_recent_note.createdAt | date:'dd MMM yyyy') ?? ''"
        [line1]="entry_recent_note.line1"
        [mood]="entry_recent_note.mood"
        [email]="entry_recent_note.email"
        [photos]="entry_recent_note.imageUrls">
      </app-note-card>
    </div>

    <!-- Floating Action Button (+) -->
    <button
      (click)="openNoteForm()"
      class="fixed w-14 bottom-6 right-6 btn btn-primary btn-circle shadow-lg"
      aria-label="สร้างบันทึกใหม่"
    >
      +
    </button>

    <!-- Modal Overlay for Note Form -->
    <div
      *ngIf="showNoteForm"
      class="fixed inset-0 z-20 flex items-end md:items-center justify-center bg-black/40"
      (click)="closeNoteForm()"
    >
      <div
        class="w-full md:w-auto md:min-w-[640px] max-w-full bg-white rounded-t-2xl md:rounded-2xl shadow-lg p-4 md:p-6"
        (click)="$event.stopPropagation()"
      >
        <div class="flex items-center justify-between">
          <h3 class="text-lg font-semibold">เขียนบันทึกเชิงบวก</h3>
          <button class="btn btn-ghost btn-sm" (click)="closeNoteForm()">Close</button>
        </div>
        <app-note-form></app-note-form>
      </div>
    </div>
  </div>

</div>
