<div
  class="dashboard-container min-h-screen flex flex-col bg-gradient-to-b from-transparent from-60% to-[#C6E2FF]"
>
<div class="cat"></div>
  <!-- Loading State -->
  <div *ngIf="isLoading()" class="loading-state">
    <div class="loading loading-dots loading-xl"></div>
    <p>กำลังโหลดข้อมูล...</p>
  </div>

  <!-- Error State -->
  <div *ngIf="error() && !isLoading()" class="error-state">
    <div class="error-message">
      <h3>เกิดข้อผิดพลาด</h3>
      <p>{{ error() }}</p>
      <button (click)="retry()" class="retry-btn">ลองใหม่</button>
    </div>
  </div>

  <!-- User Data -->
  <div *ngIf="user() && !isLoading() && !error()" class="">
    <app-header></app-header>
    <div class="flex flex-col justify-center items-center mt-7">
      <div class="w-full max-w-6xl flex justify-start text-2xl">
        <div class="flex flex-row">
          <img
            class="w-[30px] h-[30px]"
            src="assets/images/mail.png"
            alt=""
          /><span class="pl-1.5 font-bold">Overview Section</span>
        </div>
      </div>
      <div
        role="alert"
        class="bg-white flex flex-row h-20 items-center px-5 space-x-3 rounded-[10px] mb-4 w-full max-w-6xl shadow-lg"
      >
        <span class="relative flex size-3">
          <span
            class="absolute inline-flex h-full w-full animate-ping rounded-full bg-sky-400 opacity-75"
          ></span>
          <span
            class="relative inline-flex size-3 rounded-full bg-sky-500"
          ></span>
        </span>
        <div>
          <h3 class="font-bold">
            You’ve written <span>{{countNote()}}</span> notes already! ✨
          </h3>
          <div class="text-xs">
            They’re all meaningful — don’t forget to come back and add more. 💖
          </div>
        </div>
      </div>
      <div class="w-full max-w-6xl flex justify-start text-2xl my-4">
        <img
          class="w-[30px] h-[30px]"
          src="assets/images/christmas-tree.png"
          alt=""
        /><span class="pl-1.5 font-bold">Recent Notes</span>
      </div>

      <!-- Signal-based note card with computed condition -->
      <app-note-card
        *ngIf="hasRecentNote()"
        [date]="(entry_recent_note().createdAt | date:'dd MMM yyyy') ?? ''"
        [line1]="entry_recent_note().line1"
        [mood]="entry_recent_note().mood"
        [email]="entry_recent_note().email"
        [photos]="entry_recent_note().imageUrls"
      >
      </app-note-card>

      <div class="w-full max-w-6xl flex justify-start text-2xl my-4">
        <div class="flex flex-row">
          <img
            class="w-[30px] h-[30px]"
            src="assets/images/book.png"
            alt=""
          /><span class="pl-1.5 font-bold">Your Notes | :-)</span>
        </div>
      </div>
      <div class="w-full max-w-6xl flex justify-start text-2xl my-4">
        <label class="input border-[2px] rounded-2xl">
          <svg
            class="h-[1em] opacity-50"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
          >
            <g
              stroke-linejoin="round"
              stroke-linecap="round"
              stroke-width="2.5"
              fill="none"
              stroke="currentColor"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.3-4.3"></path>
            </g>
          </svg>
          <input
                         [(ngModel)]="searchTerm"
            class=""
            type="search"
            required
            placeholder="Search"
          />
        </label>
      </div>

      <div class="grid grid-cols-3 max-w-6xl mb-5">
        @for (note of filteredItems(); track note.id) {
        <app-note-card-all
          [date]="(note.createdAt | date:'dd MMM yyyy') ?? ''"
          [line1]="note.line1"
          [mood]="note.mood"
          [photos]="note.imageUrls"
          [isActive]="note.showMessage"
          class="w-full my-2 pr-2"
        >
        </app-note-card-all>
        }
      </div>
    </div>

    <!-- Floating Action Button (+) -->
    <button
      (click)="openNoteForm()"
      class="fixed w-24 bottom-6 right-6 btn btn-primary btn-circle shadow-lg"
      aria-label="สร้างบันทึกใหม่"
    >
      +
    </button>

    <!-- Modal Overlay for Note Form -->
    <div
      *ngIf="showNoteForm()"
      class="fixed inset-0 z-20 flex items-end md:items-center justify-center bg-black/40"
      (click)="closeNoteForm()"
    >
      <div
        class="w-full md:w-auto md:min-w-[640px] max-w-full rounded-t-2xl md:rounded-2xl p-4 md:p-6"
        (click)="$event.stopPropagation()"
      >
        <div class="cat2"></div>
        <app-note-form (noteCreated)="onNoteCreated()"></app-note-form>
      </div>
    </div>
  </div>
</div>
<div
        *ngIf="toastMessage()"
        class="toast toast-top toast-end z-50 transition-all duration-500 ease-in-out"
      >
        <div
          class="alert shadow-lg flex items-center gap-3 rounded-xl p-4"
          [ngClass]="toastError() ? 'alert-error' : 'alert-success'"
        >
          <!-- Icon -->
          <svg
            *ngIf="toastError(); else successIcon"
            xmlns="http://www.w3.org/2000/svg"
            class="h-6 w-6 shrink-0"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.054 0
           1.986-.816 2.07-1.866L21.86 7.134A2.072
           2.072 0 0019.79 5H4.21c-1.054 0-1.986.816-2.07
           1.866l-1.072 12a2.072 2.072 0 002.07
           2.134z"
            />
          </svg>
          <ng-template #successIcon>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-6 w-6 shrink-0"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M5 13l4 4L19 7"
              />
            </svg>
          </ng-template>

          <!-- Message -->
          <span class="font-medium text-base">{{ toastMessage() }}</span>
        </div>
      </div>
