<div *ngIf="user()" class="min-h-screen flex flex-col">
  <app-header></app-header>
  <div class="flex flex-col justify-center items-center mt-7">
    <div class="w-full max-w-6xl justify-start text-2xl">
      <div class="flex flex-row mb-6">
        <img
          class="w-[30px] h-[30px]"
          src="assets/images/mail.png"
          alt=""
        />
        <span class="pl-1.5 font-bold">Community Section</span>
      </div>

      <!-- ใช้ CSS columns -->
      <div class="grid grid-cols-12 gap-4 max-w-7xl mx-auto">
        <div
          *ngFor="let note of paginatedPosts(); let i = index"
          [ngClass]="{
            'col-span-12': isCardActive(i),
            'col-span-4': !isCardActive(i)
          }"
          class="transition-all duration-300"
          (click)="toggleCard(i)"
        >
          <app-note-card-all
            [date]="(note.createdAt | date:'dd MMM yyyy') ?? ''"
            [line1]="note.line1"
            [mood]="note.mood"
            [email]="note.email"
            [photos]="note.imageUrls"
            [name]="note.user?.name"
            [avatarUrl]="note.user?.avatarUrl"
            [isActive]="isCardActive(i)"
          >
          </app-note-card-all>
        </div>
      </div>

      <!-- Pagination Controls -->
      <div *ngIf="totalPages() > 1" class="flex justify-center mt-8">
        <div class="join">
          <!-- Previous Button -->
          <button
            class="join-item btn btn-circle mr-2"
            [disabled]="currentPage() === 1"
            (click)="previousPage()"
            aria-label="Previous page">
            «
          </button>

          <!-- Page Numbers -->
          <button
            *ngFor="let page of getPageNumbers()"
            class="join-item btn btn-circle mx-1"
            [class.btn-active]="currentPage() === page"
            (click)="goToPage(page)"
            [attr.aria-label]="'Page ' + page">
            {{ page }}
          </button>

          <!-- Next Button -->
          <button
            class="join-item btn btn-circle ml-2"
            [disabled]="currentPage() === totalPages()"
            (click)="nextPage()"
            aria-label="Next page">
            »
          </button>
        </div>
      </div>

      <!-- Page Info -->
      <div *ngIf="totalPages() > 1" class="text-center mt-4 mb-4 text-sm text-gray-600">
        หน้า {{ currentPage() }} จาก {{ totalPages() }} หน้า
        (แสดง {{ paginatedPosts().length }} รายการ)
      </div>

    </div>
  </div>
  <app-footer class="mt-auto"></app-footer>
</div>
