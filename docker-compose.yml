version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - app-network

  client:
    build:
      context: ./client
      dockerfile: ${CLIENT_DOCKERFILE:-Dockerfile}
      args:
        APP_ENV: ${APP_ENV:-production}
    ports:
      - "${CLIENT_PORT:-8080}:80"
    restart: always
    depends_on:
      - server
    networks:
      - app-network

  server:
    container_name: server
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env.${NODE_ENV:-local}
    environment:
      - DATABASE_URL=postgresql://myuser:mypassword@postgres:5432/mydb
      - PORT=3000
      - NODE_ENV=${NODE_ENV:-development}
    depends_on:
      - postgres
    networks:
      - app-network
    volumes:
      - ./server:/app
      - ./server/uploads:/app/uploads
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  app-network:
    driver: bridge